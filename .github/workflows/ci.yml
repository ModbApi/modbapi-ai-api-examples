name: Validate examples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check source files and dependencies
        run: |
          python -m py_compile python/*.py
          node --check nodejs/chat-completion.mjs
          node --check nodejs/streaming.mjs
          (cd java && mvn -q -DskipTests compile)
          bash -n curl/chat-completion.sh
          bash -n curl/streaming.sh
      - name: Reject credential-shaped values
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{20,}' -- ':!*.lock' ':!LICENSE' ':!.env.example'; then
            echo 'Potential credential found. Use placeholders and environment variables.'
            exit 1
          fi
